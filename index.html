<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #333; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>
    <script>
        (async function () {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                const ua = navigator.userAgent || 'Unknown';

                await fetch('/.netlify/functions/log-ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip, ua })
                });

                console.log('Logged IP:', ip);
            } catch (e) {
                console.error('Error:', e);
            }
        })();
    </script>
</body>
</html>
